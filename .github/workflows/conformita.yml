# Guardia del contratto: a ogni commit verifica che
#  1. contract/openapi.yaml sia ancora la versione 1.0.5 (hash; 1.0.5 = 1.0.4 con la sola documentazione, D-107/D-124);
#  2. il motore (python -m engine, connector simulato) rispetti il contratto (suite di conformità, 16 scenari +
#     connector fermo) e passi le sue prove, con quelle comuni a ogni connector (engine/); lo stesso per l'immagine
#     del motore (engine/Dockerfile), che senza chiave non deve partire;
#  3. i repository (memoria e Firestore, con emulatore) passino la suite condivisa.
# Se 1 o 2 falliscono, l'app sta usando qualcosa che il motore reale non avrà: fermarsi e correggere.
name: conformita

on:
  push:
    branches: [main]
  pull_request:

env:
  CONTRACT_SHA256: e6ed29457163707b9e43eabb428225f0a6983ea05de2a43d240d03acae001527
  # l'ambiente del motore per la conformità sta in ci/engine.vars, lo stesso file del giro sul PC (run_tests.py)

jobs:
  contratto-e-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Il contratto è invariato (v1.0.5)
        run: |
          echo "${CONTRACT_SHA256}  contract/openapi.yaml" | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dipendenze
        run: |
          pip install -r bff/requirements.txt -r contract/conformance/requirements.txt

      - name: Prove del motore e del connector (P-60)
        run: |
          pytest engine -p no:cacheprovider -q

      - name: Avvia il motore (connector simulato)
        run: |
          set -a; . ci/engine.vars; set +a
          echo "ENGINE_KEY=${API_KEY}" >> "$GITHUB_ENV"
          HOST=127.0.0.1 PORT=8100 DATA_DIR="${RUNNER_TEMP}/engine-data" nohup python -m engine > engine.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8100/api/v1/health > /dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8100/api/v1/health

      - name: Suite di conformità contro il motore
        run: |
          pytest contract/conformance --base-url http://127.0.0.1:8100/api/v1 --api-key ${ENGINE_KEY} \
            -p no:cacheprovider -q

      - name: Scenario C14 (connector fermo → 503)
        run: |
          pkill -f "python -m engine" || true
          sleep 1
          set -a; . ci/engine.vars; set +a
          HOST=127.0.0.1 PORT=8100 DATA_DIR="${RUNNER_TEMP}/engine-data-down" DOMOTICA_TEST_CONNECTOR_DOWN=1 \
            nohup python -m engine > engine-down.log 2>&1 &
          sleep 3
          pytest contract/conformance --base-url http://127.0.0.1:8100/api/v1 --api-key ${ENGINE_KEY} \
            -p no:cacheprovider -q -m connector_down

      - name: Log del motore (solo se qualcosa è fallito)
        if: failure()
        run: tail -50 engine.log engine-down.log || true

  motore-in-container:
    # l'immagine che va sulla VM (engine/Dockerfile): senza chiave non parte, con la chiave rispetta il contratto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dipendenze della suite
        run: |
          pip install -r contract/conformance/requirements.txt

      - name: Immagine del motore
        run: |
          docker build -f engine/Dockerfile -t domhouse-engine:ci .

      - name: Senza chiave il motore non parte (uscita 2)
        run: |
          set +e
          docker run --rm -e APARTMENT_ID=apt-ci-01 -e CONNECTOR=simulated domhouse-engine:ci
          code=$?
          echo "uscita $code"
          test "$code" -eq 2

      - name: Avvia il motore nel container
        run: |
          echo "ENGINE_KEY=$(sed -n 's/^API_KEY=//p' ci/engine.vars)" >> "$GITHUB_ENV"
          docker run -d --name engine -p 127.0.0.1:8100:8100 --env-file ci/engine.vars domhouse-engine:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8100/api/v1/health > /dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8100/api/v1/health

      - name: Suite di conformità contro il container
        run: |
          pytest contract/conformance --base-url http://127.0.0.1:8100/api/v1 --api-key ${ENGINE_KEY} \
            -p no:cacheprovider -q

      - name: Log del container (solo se qualcosa è fallito)
        if: failure()
        run: docker logs engine 2>&1 | tail -50 || true

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4          # firebase-tools richiede Java 21+ per l'emulatore
        with:
          distribution: temurin
          java-version: "21"

      - name: Dipendenze
        run: |
          pip install -r bff/requirements.txt pytest pytest-asyncio
          npm install -g firebase-tools
          java -version

      - name: Avvia l'emulatore Firestore
        run: |
          # 127.0.0.1 esplicito: su alcuni runner "localhost" risolve prima in ::1 e il client gRPC non trova l'emulatore
          nohup firebase emulators:start --only firestore --project demo-ci --config ci/firebase.emulators.json \
            > emulator.log 2>&1 &
          # pronto quando la porta accetta connessioni (la risposta HTTP alla radice non è garantita)
          for i in $(seq 1 90); do
            (exec 3<>/dev/tcp/127.0.0.1/8900) 2>/dev/null && break || sleep 2
          done
          (exec 3<>/dev/tcp/127.0.0.1/8900) 2>/dev/null || { echo "emulatore non partito"; cat emulator.log; exit 1; }
          echo "emulatore in ascolto su 8900"; tail -5 emulator.log

      - name: Suite dei repository (memoria + Firestore con emulatore)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8900
          GCP_PROJECT_ID: demo-ci
        run: |
          pytest tests/repository_suite_test.py -p no:cacheprovider -q -ra

      - name: Log dell'emulatore (solo se qualcosa è fallito)
        if: failure()
        run: |
          tail -80 emulator.log || true
          tail -80 firebase-debug.log ci/firebase-debug.log 2>/dev/null || true
