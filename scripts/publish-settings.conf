# Impostazioni di scripts/publish-all.sh (D-214). Nessun segreto: sono i valori che prima si scrivevano a mano davanti
# a publish.sh. Una riga NOME=valore per impostazione; le righe che iniziano con # si ignorano. Le legge solo
# publish-all.sh, che non accetta nomi diversi da questi.
GCP_PROJECT_ID=domotica-poc-511707
GCP_REGION=europe-west8
ARTIFACT_REPO=domotica
# l'account proprietario con cui gcloud pubblica (D-116: è il committente che lancia lo script)
CLOUDSDK_CORE_ACCOUNT=m.scardovellicrac@gmail.com
STAGING_SITE=domhouse-staging
VPC_NETWORK=default
VPC_SUBNET=default
# il mittente delle email d'invito (un indirizzo, non una password: quella è il segreto smtp-app-password)
SMTP_USER=m.scardovellicrac@gmail.com
# notifiche push accese nel sito, in staging (D-39) e in produzione
VITE_FCM_ENABLED=true
# il motore sulla VM che si aggiorna quando cambia il suo codice
ENGINE_APARTMENT=dev
VM_NAME=langbrain-dev
VM_ZONE=europe-west8-a
# D04 (P-83): l'indirizzo interno della VM, per l'elenco dei motori che lo staging può raggiungere (INSTANCE_ALLOWED)
VM_INTERNAL_IP=10.198.0.2
