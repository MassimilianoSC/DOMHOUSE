# Il motore DOMHOUSE sulla VM: un progetto Compose per appartamento, tutti da questo stesso file. Lo usa
# scripts/engine-vm.sh (procedura in docs/motore-vm.md), che per ogni appartamento scrive due file fuori dal repository:
#   /opt/domhouse/<apartment_id>.settings   APARTMENT_ID, PORT, CONNECTOR, ENGINE_IMAGE (niente segreti)
#   /etc/domhouse/<apartment_id>.env        API_KEY=<segreto langbrain-api-key-<apartment_id>>, permessi 600
# e, solo se si cambia un'impostazione del motore (engine-vm.sh set/unset, D-131), un terzo file senza segreti:
#   /etc/domhouse/<apartment_id>.settings.env   per esempio CONFIRM_ON_WATTS=30; facoltativo
# e poi lancia, per quell'appartamento:
#   docker compose --env-file /opt/domhouse/<apartment_id>.settings -f /opt/domhouse/compose.yaml up -d
# Porta 81xx pubblicata sul solo indirizzo interno della VM (D-218), quello dell'istanza nell'app: ENGINE_BIND_IP, che
# engine-vm.sh legge dai metadati della VM. Né su loopback né sulle reti Docker. Da internet la protegge comunque il
# firewall VPC (langbrain-allow-internal la apre solo a 10.198.0.0/20, langbrain-deny-other-ingress chiude il resto):
# su Google Cloud l'indirizzo pubblico non sta sulla scheda della VM, arriva tradotto su quello interno. Dati in
# /data/<apartment_id>
# (proprietario uid 10001, l'utente del container), restart: unless-stopped (D-104), log JSON di Docker ruotati.
# L'istanza «dev» (porta 8100) resta PER SEMPRE con CONNECTOR=simulated: è l'ambiente di prova, anche dopo il
# connector Shelly (D-118). Gli appartamenti veri sono istanze a parte, ciascuna con il suo apartment_id, la sua porta
# e il suo segreto langbrain-api-key-<apartment_id>.
name: domhouse-${APARTMENT_ID:?APARTMENT_ID}

services:
  engine:
    image: ${ENGINE_IMAGE:?ENGINE_IMAGE}
    container_name: engine-${APARTMENT_ID}
    restart: unless-stopped
    # o1-chiusura (23 Nov): Docker's 10 s were less than the engine's stop (uvicorn 2 s for the open streams, then at
    # most 5 s for the connector and 5 s for its tasks): at 20 s the stop always runs before SIGKILL
    stop_grace_period: 20s
    environment:
      APARTMENT_ID: ${APARTMENT_ID}
      CONNECTOR: ${CONNECTOR:?CONNECTOR}     # D62 (P-83): no default, a real apartment never starts simulated
      PORT: ${PORT:?PORT}
    env_file:
      - path: /etc/domhouse/${APARTMENT_ID}.env
        required: true
      - path: /etc/domhouse/${APARTMENT_ID}.settings.env
        required: false
    # decision 1128: limits for each engine (engine-vm.sh passes them: 120 MB for the test engines dev/lab-/test-,
    # 256 MB for the others, no swap; one CPU at most; 128 processes), and no capability: the engine needs none
    mem_limit: ${ENGINE_MEM_LIMIT:-256m}
    memswap_limit: ${ENGINE_MEM_LIMIT:-256m}
    cpus: ${ENGINE_CPUS:-1.0}
    pids_limit: ${ENGINE_PIDS_LIMIT:-128}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${ENGINE_BIND_IP:?ENGINE_BIND_IP}:${PORT}:${PORT}"
    volumes:
      - /data/${APARTMENT_ID}:/data/${APARTMENT_ID}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/v1/health' % os.environ['PORT'], timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
