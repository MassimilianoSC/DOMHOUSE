# Il motore DOMHOUSE sulla VM: un progetto Compose per appartamento, tutti da questo stesso file. Lo usa
# scripts/engine-vm.sh (procedura in docs/motore-vm.md), che per ogni appartamento scrive due file fuori dal repository:
#   /opt/domhouse/<apartment_id>.settings   APARTMENT_ID, PORT, CONNECTOR, ENGINE_IMAGE (niente segreti)
#   /etc/domhouse/<apartment_id>.env        API_KEY=<segreto langbrain-api-key-<apartment_id>>, permessi 600
# e poi lancia, per quell'appartamento:
#   docker compose --env-file /opt/domhouse/<apartment_id>.settings -f /opt/domhouse/compose.yaml up -d
# Porta 81xx sull'IP interno della VM (quella dell'indirizzo dell'istanza nell'app), dati in /data/<apartment_id>
# (proprietario uid 10001, l'utente del container), restart: unless-stopped (D-104), log JSON di Docker ruotati.
# L'istanza «dev» (porta 8100) resta PER SEMPRE con CONNECTOR=simulated: è l'ambiente di prova, anche dopo il
# connector Shelly (D-118). Gli appartamenti veri sono istanze a parte, ciascuna con il suo apartment_id, la sua porta
# e il suo segreto langbrain-api-key-<apartment_id>.
name: domhouse-${APARTMENT_ID:?APARTMENT_ID}

services:
  engine:
    image: ${ENGINE_IMAGE:?ENGINE_IMAGE}
    container_name: engine-${APARTMENT_ID}
    restart: unless-stopped
    environment:
      APARTMENT_ID: ${APARTMENT_ID}
      CONNECTOR: ${CONNECTOR:-simulated}
      PORT: ${PORT:?PORT}
    env_file:
      - path: /etc/domhouse/${APARTMENT_ID}.env
        required: true
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - /data/${APARTMENT_ID}:/data/${APARTMENT_ID}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/v1/health' % os.environ['PORT'], timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
