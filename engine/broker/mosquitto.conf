# Il broker MQTT dei dispositivi (D-196, D-199), sulla VM dei motori. Lo gestisce scripts/broker-vm.sh; procedura in
# docs/motore-vm.md. Due ascoltatori con utenti separati: i dispositivi entrano solo dalla 8883 con TLS, i connector
# solo dalla porta interna, che non è pubblicata e ascolta sul solo indirizzo della rete Docker interna.
#
# I file di auth/ li scrive broker_accounts.py dai segreti (solo hash); una ricarica (SIGHUP, broker-vm.sh reload o
# sync) rilegge utenti, permessi e certificato senza riavviare e senza far cadere chi è collegato.
# Attenzione: dalla 2.1 un file di utenti o permessi non valido durante una ricarica fa uscire il broker. Per questo
# i file si scrivono solo dopo averli controllati, e sempre per sostituzione atomica.

per_listener_settings true

persistence true
persistence_location /mosquitto/data/
autosave_interval 300
# una sessione persistente non rivista per 14 giorni si cancella (un relè tolto non resta in memoria per sempre)
persistent_client_expiration 14d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# Limiti: valori misurati con tests/broker_load.py (numeri in docs/motore-vm.md). Bastano a proteggere la VM anche
# se un connector resta scollegato a lungo: oltre il limite i messaggi di quel client si scartano, la memoria no.
memory_limit 400000000
max_queued_messages 1000
max_queued_bytes 1000000
max_inflight_messages 20
# Ferma i pacchetti anomali. La dimensione vera dei messaggi di uno Shelly si misura in laboratorio (docs/limiti-noti.md).
max_packet_size 262144

# ── Dispositivi: dall'esterno, solo TLS ──
listener 8883
protocol mqtt
certfile /mosquitto/tls/fullchain.pem
keyfile /mosquitto/tls/privkey.pem
allow_anonymous false
password_file /mosquitto/auth/devices.passwd
acl_file /mosquitto/auth/devices.acl

# ── Connector: solo dalla rete Docker interna (stesso indirizzo di compose.yaml) ──
listener 1883 172.30.83.2
protocol mqtt
allow_anonymous false
password_file /mosquitto/auth/connectors.passwd
acl_file /mosquitto/auth/connectors.acl
