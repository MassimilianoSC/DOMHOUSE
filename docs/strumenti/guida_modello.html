<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Guida all'app DOMHOUSE</title>
  <style>
    :root {
      color-scheme:light dark;
      --page:#f4f2ec; --paper:#ffffff; --ink:#1f2a26; --muted:#5d6a64; --accent:#1a6a4f; --accent-ink:#135239;
      --accent-soft:#e9f3ed; --line:#dfdcd3; --line-strong:#c9c5ba; --sidebar:#f9f8f4; --code-bg:#edf1ec;
      --warning:#6d4a08; --warning-bg:#fff4dc; --warning-line:#e8c97a; --coming:#5d3f85; --coming-bg:#f1ebf8;
      --hero:#16382d; --hero-ink:#f3f6f0; --hero-muted:#cfdccf; --gold:#d9c27f; --focus:#0b63c7;
      --strong:#101a15; --zebra:#f6f5f0;
      --note-warning-bg:#fff3dc; --note-warning-line:#e3a93a; --note-warning-ink:#6b4a0a;
      --note-info-bg:#e8f1fb; --note-info-line:#4f8fd6; --note-info-ink:#17426e;
      --note-example-bg:#eaf5ec; --note-example-line:#4fa36f; --note-example-ink:#1e5a37;
      --shadow:0 10px 34px rgba(31,42,38,.06); --sidebar-width:300px; --header-h:68px;
      --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
      --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      --mono:ui-monospace,"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --page:#121a16; --paper:#1a2420; --ink:#e7ede8; --muted:#aab8b1; --accent:#8fd3b1; --accent-ink:#b9e6cf;
        --accent-soft:#22362c; --line:#2f3e36; --line-strong:#43554b; --sidebar:#161f1b; --code-bg:#263530;
        --warning:#f0cf84; --warning-bg:#33291a; --warning-line:#6a5425; --coming:#d4bdf4; --coming-bg:#2f2740;
        --hero:#1c4536; --hero-ink:#f3f6f0; --hero-muted:#c9d9cb; --shadow:none; --focus:#8bbdff;
        --strong:#ffffff; --zebra:#1f2b26;
        --note-warning-bg:#3a2d14; --note-warning-line:#c99a3c; --note-warning-ink:#f5d9a0;
        --note-info-bg:#1b2b3d; --note-info-line:#5b9be0; --note-info-ink:#cfe3fb;
        --note-example-bg:#1d3326; --note-example-line:#5fb584; --note-example-ink:#cdebd8;
      }
    }
    *, *::before, *::after { box-sizing:border-box; }
    html { scroll-padding-top:calc(var(--header-h) + 20px); scroll-behavior:smooth; }
    body {
      margin:0; background:var(--page); color:var(--ink); font:1.02rem/1.75 var(--sans);
      overflow-wrap:break-word; -webkit-text-size-adjust:100%; min-width:0;
    }
    a { color:var(--accent-ink); text-decoration-thickness:1px; text-underline-offset:.2em; overflow-wrap:anywhere; }
    a:hover { text-decoration-thickness:2px; }
    button, summary { font:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:3px solid var(--focus); outline-offset:3px; border-radius:4px; }
    .skip-link { position:fixed; top:8px; left:16px; z-index:30; background:var(--paper); color:var(--ink); padding:10px 16px; border-radius:8px; transform:translateY(-200%); }
    .skip-link:focus { transform:none; }

    /* ---- barra in alto ---- */
    .site-header {
      position:fixed; inset:0 0 auto; z-index:20; height:var(--header-h); display:flex; align-items:center; gap:18px;
      padding:0 28px; background:var(--paper); border-bottom:1px solid var(--line);
    }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font-size:14px; font-weight:800; letter-spacing:.14em; }
    .brand-mark { display:grid; place-items:center; width:32px; height:36px; background:var(--hero); color:var(--gold); border-radius:9px 9px 4px 4px; }
    .brand-mark svg { width:20px; height:20px; }
    .brand small { font-weight:600; letter-spacing:.02em; color:var(--muted); font-size:12px; }
    .document-nav { display:flex; gap:4px; margin-left:auto; }
    .document-nav a { padding:8px 14px; border-radius:8px; color:var(--muted); font-size:.86rem; font-weight:650; text-decoration:none; }
    .document-nav a[aria-current=page] { color:var(--accent-ink); background:var(--accent-soft); }
    .header-print { padding:8px 14px; border:1px solid var(--line-strong); border-radius:8px; background:var(--paper); color:var(--ink); font-size:.82rem; }
    .reading-track { position:absolute; left:0; right:0; bottom:-1px; height:3px; }
    .reading-track span { display:block; height:100%; width:0; background:var(--accent); }

    /* ---- impaginazione ---- */
    .document { margin-left:var(--sidebar-width); padding:calc(var(--header-h) + 36px) clamp(20px,4vw,64px) 72px; min-width:0; }
    .cover, article, .document-footer { max-width:880px; margin-inline:auto; min-width:0; }

    /* ---- copertina ---- */
    .cover { position:relative; isolation:isolate; overflow:hidden; border-radius:20px; background:var(--hero); color:var(--hero-ink); padding:44px 48px 40px; margin-bottom:28px; }
    .cover::after { content:""; position:absolute; z-index:-1; width:320px; height:320px; right:-110px; top:-120px; border:1px solid rgba(243,246,240,.14); border-radius:50%; box-shadow:0 0 0 44px rgba(243,246,240,.04), 0 0 0 88px rgba(243,246,240,.03); }
    .eyebrow { color:var(--gold); font-size:.7rem; font-weight:750; letter-spacing:.18em; text-transform:uppercase; margin:0 0 16px; }
    h1 { font-family:var(--serif); font-weight:600; max-width:20ch; font-size:clamp(2.1rem,4vw,3.1rem); line-height:1.12; letter-spacing:-.02em; margin:0 0 16px; text-wrap:balance; }
    .subtitle { max-width:60ch; font-size:1.05rem; line-height:1.6; color:var(--hero-muted); margin:0 0 20px; }
    .version { display:inline-block; color:var(--hero-muted); font-size:.76rem; padding:6px 12px; border:1px solid rgba(243,246,240,.28); border-radius:999px; margin:0; }
    .version em { font-style:normal; }

    /* ---- indice ---- */
    .toc { position:fixed; top:var(--header-h); bottom:0; left:0; width:var(--sidebar-width); padding:28px 16px 40px 22px; background:var(--sidebar); border-right:1px solid var(--line); overflow-y:auto; scrollbar-width:thin; }
    .toc summary { list-style:none; cursor:pointer; padding:0 10px 14px; color:var(--muted); font-size:.68rem; font-weight:750; letter-spacing:.15em; text-transform:uppercase; }
    .toc summary::-webkit-details-marker { display:none; }
    .toc summary::after { content:"+"; float:right; font-size:16px; line-height:1; }
    .toc details[open] summary::after { content:"−"; }
    .toc ol { list-style:none; margin:0; padding:0; }
    .toc > details > ol > li { margin-bottom:3px; }
    .toc a { display:block; padding:7px 10px; border-radius:7px; color:var(--muted); text-decoration:none; font-size:.8rem; line-height:1.45; }
    .toc > details > ol > li > a { font-weight:650; color:var(--ink); }
    .toc a:hover { color:var(--accent-ink); background:var(--accent-soft); }
    .toc a[aria-current=location] { color:var(--accent-ink); font-weight:700; background:var(--accent-soft); box-shadow:inset 3px 0 var(--accent); }
    .toc li ol { display:none; margin:2px 0 10px 10px; padding-left:10px; border-left:1px solid var(--line-strong); }
    .toc li.is-active > ol, .toc li:focus-within > ol { display:block; }
    .toc li ol a { font-size:.76rem; padding:5px 9px; font-weight:500; }
    .toc-hint { margin:14px 10px 0; font-size:.72rem; color:var(--muted); line-height:1.5; }

    /* ---- testo ---- */
    article > p, article > blockquote { margin-inline:4px; }
    p { margin:0 0 1.05em; }
    strong { font-weight:750; color:var(--strong); }
    .lead { font-size:1.08rem; font-weight:750; line-height:1.5; color:var(--accent-ink); margin:0 0 14px; }
    .lead strong { color:inherit; }
    section { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:30px 36px 28px; margin:22px 0; box-shadow:var(--shadow); }
    section > :last-child { margin-bottom:0; }
    article > section:first-of-type { border-top:4px solid var(--accent); }
    h2 { font-family:var(--serif); font-weight:600; font-size:1.75rem; line-height:1.2; letter-spacing:-.015em; margin:0 0 20px; padding-bottom:14px; border-bottom:1px solid var(--line); text-wrap:balance; }
    h3 { font-size:1.14rem; font-weight:750; line-height:1.3; margin:34px 0 14px; padding:7px 14px; border-left:6px solid var(--accent); border-radius:0 8px 8px 0; background:linear-gradient(90deg, var(--accent-soft), transparent 75%); color:var(--ink); text-wrap:balance; }
    h3:first-of-type { margin-top:22px; }
    ul, ol { margin:.6rem 0 1.4rem; padding-left:1.6rem; }
    li { padding-left:.3rem; margin-bottom:.75rem; }
    li > p { margin-bottom:.45rem; }
    li > :last-child { margin-bottom:0; }
    li ul, li ol { margin-top:.5rem; }
    li::marker { color:var(--accent-ink); font-weight:700; }
    ol > li::marker { font-variant-numeric:tabular-nums; }
    code { padding:.12em .4em; background:var(--code-bg); border-radius:5px; font:.86em var(--mono); overflow-wrap:anywhere; }
    blockquote { padding:16px 20px; margin:22px 0; border-left:4px solid var(--accent); border-radius:0 12px 12px 0; background:var(--accent-soft); }
    blockquote p:last-child { margin-bottom:0; }
    .test-notice { border-color:var(--warning-line); background:var(--warning-bg); color:var(--warning); }
    .note-warning, .note-info, .note-example { border-left-width:6px; }
    .note-warning { border-color:var(--note-warning-line); background:var(--note-warning-bg); color:var(--note-warning-ink); }
    .note-info { border-color:var(--note-info-line); background:var(--note-info-bg); color:var(--note-info-ink); }
    .note-example { border-color:var(--note-example-line); background:var(--note-example-bg); color:var(--note-example-ink); }
    .note-warning strong, .note-info strong, .note-example strong, .test-notice strong { color:inherit; }
    blockquote > p:first-child > strong:first-child { display:inline-block; margin-right:.35em; padding:.05em .5em; border-radius:6px; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; background:rgba(255,255,255,.55); }
    @media (prefers-color-scheme:dark) { blockquote > p:first-child > strong:first-child { background:rgba(0,0,0,.25); } }
    blockquote ul, blockquote ol { margin-bottom:.4rem; }
    .role-label, .upcoming-label { display:inline; padding:.08em .4em; border:1px solid var(--line-strong); border-radius:6px; font-size:.82em; font-weight:650; font-family:var(--sans); box-decoration-break:clone; -webkit-box-decoration-break:clone; }
    .role-label { color:var(--accent-ink); background:var(--accent-soft); }
    .upcoming-label, .upcoming-note { color:var(--coming); background:var(--coming-bg); border-radius:5px; padding:.08em .3em; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
    .upcoming-note { font-style:normal; border-bottom:1px solid var(--coming); }
    hr { border:0; border-top:1px solid var(--line); margin:26px 0; }

    /* ---- tabelle ---- */
    .table-scroll { max-width:100%; border:1px solid var(--line); border-radius:12px; margin:18px 0 24px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; line-height:1.6; }
    th, td { padding:12px 14px; vertical-align:top; border-bottom:1px solid var(--line); line-height:1.55; }
    th { background:var(--accent-soft); color:var(--accent-ink); font-size:.76rem; font-weight:750; letter-spacing:.04em; text-transform:uppercase; }
    td:first-child { font-weight:600; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr:nth-child(even) { background:var(--zebra); }
    .align-left { text-align:left; } .align-center { text-align:center; } .align-right { text-align:right; }

    /* ---- piede ---- */
    .document-footer { margin-top:36px; display:flex; justify-content:space-between; gap:16px; font-size:.78rem; color:var(--muted); }
    .to-index { position:fixed; right:14px; bottom:14px; z-index:15; display:none; padding:10px 14px; border:1px solid var(--line-strong); border-radius:999px; background:var(--paper); color:var(--ink); font-size:.8rem; font-weight:650; text-decoration:none; box-shadow:0 6px 20px rgba(0,0,0,.12); }

    @media (min-width:1101px) { .toc summary { pointer-events:none; } .toc summary::after { display:none; } }
    @media (max-width:1100px) {
      .document { margin-left:0; padding:calc(var(--header-h) + 24px) 24px 56px; }
      .toc { position:static; width:auto; max-width:880px; margin:0 auto 22px; padding:16px 18px; border:1px solid var(--line); border-radius:14px; }
      .toc summary { padding:0; font-size:.74rem; }
      .toc details[open] summary { padding-bottom:14px; }
      .toc > details > ol { columns:2; column-gap:22px; }
      .toc > details > ol > li { break-inside:avoid; }
      .toc li ol { display:block; }
      .toc-hint { display:none; }
      .to-index { display:inline-block; }
    }
    @media (max-width:560px) {
      :root { --header-h:58px; }
      .site-header { padding:0 14px; gap:8px; }
      .brand { font-size:11px; gap:7px; letter-spacing:.08em; }
      .brand small { display:none; }
      .brand-mark { width:26px; height:30px; border-radius:7px 7px 3px 3px; }
      .document-nav { gap:2px; }
      .document-nav a { font-size:.74rem; padding:7px 9px; }
      .header-print { display:none; }
      .document { padding:calc(var(--header-h) + 16px) 16px 64px; }
      .cover { padding:26px 22px 24px; border-radius:14px; margin-bottom:18px; }
      h1 { font-size:2rem; }
      .eyebrow { font-size:.62rem; margin-bottom:12px; }
      .subtitle { font-size:.95rem; }
      .version { font-size:.7rem; }
      .toc { padding:14px 16px; margin-bottom:18px; }
      .toc > details > ol { columns:1; }
      .toc li ol { display:none; }
      .toc li.is-active > ol { display:block; }
      body { font-size:.97rem; line-height:1.7; }
      section { padding:20px 16px 18px; border-radius:12px; margin:16px 0; }
      h2 { font-size:1.45rem; padding-bottom:12px; margin-bottom:16px; }
      h3 { font-size:1.05rem; margin-top:24px; }
      ul, ol { padding-left:1.25rem; }
      blockquote { padding:14px 16px; }
      .lead { font-size:1.02rem; }
      h3 { padding:6px 12px; border-left-width:5px; }
      /* tabelle impilate: ogni riga è una scheda, ogni cella ripete la sua intestazione */
      .table-scroll { border:0; border-radius:0; }
      table, tbody, tr, td { display:block; width:100%; }
      thead { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
      tr { border:1px solid var(--line); border-radius:12px; margin-bottom:12px; background:var(--paper); overflow:hidden; }
      tbody tr:nth-child(even) { background:var(--paper); }
      td { padding:10px 14px; border-bottom:1px solid var(--line); text-align:left; }
      td:first-child { background:var(--accent-soft); color:var(--accent-ink); font-weight:700; }
      tr td:last-child { border-bottom:0; }
      td::before { content:attr(data-label); display:block; margin-bottom:2px; font-size:.68rem; font-weight:750; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
      td:first-child::before { color:var(--accent-ink); opacity:.8; }
      .document-footer { flex-direction:column; gap:6px; }
    }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }

    /* ---- stampa ---- */
    @page { size:A4; margin:16mm 15mm 18mm; }
    @media print {
      :root { color-scheme:light; --page:#fff; --paper:#fff; --ink:#111; --muted:#333; --accent:#174c3b; --accent-ink:#174c3b; --accent-soft:#fff; --line:#aaa; --line-strong:#888; --sidebar:#fff; --warning:#493000; --warning-bg:#fff; --warning-line:#888; --coming:#45315d; --coming-bg:#fff; --code-bg:#fff; --strong:#000; --zebra:#f3f3f3; --note-warning-bg:#fff; --note-warning-line:#555; --note-warning-ink:#111; --note-info-bg:#fff; --note-info-line:#555; --note-info-ink:#111; --note-example-bg:#fff; --note-example-line:#555; --note-example-ink:#111; }
      html { scroll-padding-top:0; scroll-behavior:auto; }
      body { font-size:10pt; line-height:1.5; }
      .site-header, .skip-link, .document-footer, .to-index, .toc-hint { display:none; }
      .document { margin:0; padding:0; }
      .cover, article { max-width:none; }
      .cover { background:#fff; color:#111; border-radius:0; padding:0 0 18px; margin-bottom:18px; border-bottom:2px solid #174c3b; break-inside:avoid; }
      .cover::after { display:none; }
      .eyebrow, .subtitle, .version { color:#333; }
      .version { border-color:#888; }
      h1 { font-size:26pt; }
      .toc { position:static; width:auto; max-width:none; height:auto; overflow:visible; padding:0; margin:0 0 22px; border:0; background:#fff; break-after:page; }
      .toc summary { padding:0 0 10px; }
      .toc summary::after { display:none; }
      .toc > details > ol { columns:2; column-gap:20px; }
      .toc li ol { display:block; }
      .toc a { font-size:8.5pt; padding:2px 0; color:#111; }
      .toc > details > ol > li > a { font-weight:700; }
      .toc a[aria-current=location] { box-shadow:none; background:transparent; }
      .toc li ol a { font-size:7.8pt; padding:1px 0; }
      section { padding:0; border:0; border-radius:0; margin:22px 0; box-shadow:none; }
      article > section:first-of-type { border-top:0; }
      h2 { font-size:16pt; padding-bottom:8px; }
      h3 { font-size:11.5pt; margin-top:18px; border-left-width:3px; }
      h1, h2, h3 { break-after:avoid-page; }
      p { orphans:3; widows:3; }
      blockquote { background:transparent; break-inside:avoid; border:1px solid #888; border-left-width:4px; }
      blockquote > p:first-child > strong:first-child { background:transparent; padding:0; }
      h3 { background:transparent; border-radius:0; padding:2px 10px; }
      .table-scroll { border-radius:0; overflow:visible; }
      table { table-layout:fixed; font-size:8.5pt; }
      th, td { padding:6px; overflow-wrap:anywhere; }
      thead { display:table-header-group; }
      tr { break-inside:avoid; }
      a { color:inherit; text-decoration:none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#contenuto">Vai alla guida</a>
  <header class="site-header">
    <a class="brand" href="#guida" aria-label="DOMHOUSE, inizio della guida"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 9-7 9 7v11H3Z"/><path d="M9 21v-8h6v8"/></svg></span>DOMHOUSE <small>· Guida utente</small></a>
    <nav class="document-nav" aria-label="Documenti"><a href="guida-utente.html" aria-current="page">Guida utente</a><a href="checklist-collaudo.html">Checklist</a></nav>
    <button class="header-print" id="print-guide" type="button">Stampa / PDF</button>
    <div class="reading-track" aria-hidden="true"><span id="reading-progress"></span></div>
  </header>
  <main class="document" id="guida">
    <header class="cover">
      <p class="eyebrow">DOMHOUSE · Guida utente</p>
{{COPERTINA}}
    </header>
    <nav class="toc" id="indice" aria-label="Indice della guida">
      <details open id="guide-index">
      <summary>In questa guida</summary>
      <ol>
{{INDICE}}
      </ol>
      </details>
      <p class="toc-hint">Le voci della parte che stai leggendo si aprono da sole.</p>
    </nav>
    <article id="contenuto" tabindex="-1">
{{CONTENUTO}}
    </article>
    <footer class="document-footer"><span>DOMHOUSE · Guida utente</span><a href="#guida">Torna all'inizio ↑</a></footer>
    <a class="to-index" href="#indice">Indice ↑</a>
  </main>
  <script>
  (() => {
    const index = document.getElementById('guide-index');
    const compact = matchMedia('(max-width: 1100px)');
    const updateIndex = () => { index.open = !compact.matches; };
    updateIndex(); compact.addEventListener('change', updateIndex);
    document.getElementById('print-guide').addEventListener('click', () => window.print());
    const links = [...document.querySelectorAll('.toc a')];
    const headings = links.map(a => document.getElementById(a.hash.slice(1))).filter(Boolean);
    const topItems = [...document.querySelectorAll('.toc > details > ol > li')];
    let scheduled = false;
    const update = () => {
      scheduled = false;
      const atEnd = scrollY + innerHeight >= document.documentElement.scrollHeight - 4;
      const current = atEnd ? headings[headings.length - 1] : (headings.filter(h => h.getBoundingClientRect().top <= 140).pop() || headings[0]);
      for (const a of links) {
        if (current && a.hash === '#' + current.id) a.setAttribute('aria-current', 'location');
        else a.removeAttribute('aria-current');
      }
      for (const li of topItems) li.classList.toggle('is-active', Boolean(li.querySelector('a[aria-current=location]')));
      const active = document.querySelector('.toc a[aria-current=location]');
      if (active && !compact.matches) {
        const box = document.querySelector('.toc').getBoundingClientRect();
        const r = active.getBoundingClientRect();
        if (r.top < box.top + 40 || r.bottom > box.bottom - 40) active.scrollIntoView({ block: 'center' });
      }
      const max = document.documentElement.scrollHeight - innerHeight;
      document.getElementById('reading-progress').style.width = (max > 0 ? Math.min(100, Math.max(0, scrollY / max * 100)) : 100) + '%';
    };
    addEventListener('scroll', () => { if (!scheduled) { scheduled = true; requestAnimationFrame(update); } }, {passive:true});
    addEventListener('resize', update); update();
    let wasOpen;
    addEventListener('beforeprint', () => { if (wasOpen === undefined) wasOpen = index.open; index.open = true; });
    addEventListener('afterprint', () => { if (wasOpen !== undefined) index.open = wasOpen; wasOpen = undefined; });
  })();
  </script>
</body>
</html>
