# Cloud Run service for the BFF — STAGING: mock instance built into the BFF, simulator enabled,
# Firestore + Firebase Auth real. Use this until the real domotica engine is reachable on the VM,
# then switch to cloudrun.yaml (INSTANCE_MODE=real, VPC egress).
# Placeholders replaced by scripts/deploy.sh: your-gcp-project-id, europe-west8, image tag.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: domotica-bff
  labels:
    app: domotica-appartamenti
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"          # keeps SSE relays warm
        autoscaling.knative.dev/maxScale: "1"          # the mock keeps its state in memory: one instance only
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: domotica-bff@your-gcp-project-id.iam.gserviceaccount.com
      containerConcurrency: 250
      timeoutSeconds: 3600                             # SSE streams
      containers:
        - image: europe-west8-docker.pkg.dev/your-gcp-project-id/domotica/bff:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: staging
            - name: AUTH_MODE
              value: firebase
            - name: INSTANCE_MODE
              value: mock
            # no INSTANCE_API_KEY_FALLBACK: the BFF generates a random mock key at startup (F2, D-70); the mock is also
            # refused from the internet (only the BFF's own loopback call reaches it)
            - name: MOCK_TIME_SCALE
              value: "60"                              # real time
            - name: REPOSITORY
              value: firestore
            - name: FCM_ENABLED            # push on in staging (D-39): needed to test checklist section H; FCM is free
              value: "true"
            - name: GCP_PROJECT_ID
              value: your-gcp-project-id
            - name: GCP_REGION
              value: europe-west8
            - name: FIREBASE_PROJECT_ID
              value: your-gcp-project-id
            - name: CORS_ORIGINS
              value: https://your-gcp-project-id.web.app,https://your-gcp-project-id.firebaseapp.com
            - name: SECRET_MANAGER_PREFIX
              value: langbrain-api-key-
            - name: INSTANCE_TIMEOUT_S
              value: "10"
            - name: ITALIANWAY_SIGNATURE_HEADER
              value: X-Signature
            - name: ITALIANWAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: italianway-webhook-secret
                  key: latest
            - name: APP_PUBLIC_URL
              value: https://your-gcp-project-id.web.app
            - name: SMTP_HOST
              value: smtp.gmail.com
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_USER
              value: your-smtp-user@example.com            # replaced by scripts/deploy.sh (SMTP_USER)
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-app-password
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
