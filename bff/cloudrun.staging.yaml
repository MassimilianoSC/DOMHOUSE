# Cloud Run service for the BFF — STAGING (P-67, D-136): a service of its own, domotica-bff-staging, in the same
# project as production, with its own Firestore database ("staging") and its own Hosting site; the demonstration
# apartments live here (mock://, built into the BFF, AI_DEMOS) and the VM's engine "dev" is reached through the same
# Direct VPC egress as production. Firebase Auth is the project's one: tenant and role per environment in the claims.
# Always on with one instance (D-136: the demonstrations keep their state in memory).
# Placeholders replaced by scripts/deploy.sh: your-gcp-project-id, europe-west8, image tag, your-vpc-network,
# your-vpc-subnet, your-staging-site (the Hosting site, <project>-staging by default).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: domotica-bff-staging
  labels:
    app: domotica-appartamenti
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"          # keeps SSE relays warm
        autoscaling.knative.dev/maxScale: "1"          # the mock keeps its state in memory: one instance only
        run.googleapis.com/cpu-throttling: "false"
        # the VM's engine "dev" belongs to staging (D-136 point 2): Direct VPC egress on the default network
        run.googleapis.com/network-interfaces: '[{"network":"your-vpc-network","subnetwork":"your-vpc-subnet"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: domotica-bff@your-gcp-project-id.iam.gserviceaccount.com
      containerConcurrency: 250
      timeoutSeconds: 3600                             # SSE streams
      containers:
        - image: europe-west8-docker.pkg.dev/your-gcp-project-id/domotica/bff:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: staging
            - name: AUTH_MODE
              value: firebase
            - name: INSTANCE_MODE
              value: real                              # D-136: the VM's dev engine; mock:// works in every mode
            # no INSTANCE_API_KEY_FALLBACK: the BFF generates a random mock key at startup (F2, D-70); the mock is also
            # refused from the internet (only the BFF's own loopback call reaches it)
            - name: MOCK_TIME_SCALE
              value: "60"                              # real time
            - name: REPOSITORY
              value: firestore
            - name: FIRESTORE_DATABASE     # its own database (P-67)
              value: staging
            - name: FCM_ENABLED            # push on in staging (D-39): needed to test checklist section H; FCM is free
              value: "true"
            - name: AI_LOCATION            # D-180: the model in the EU, eu or europe-… (deploy.sh and the BFF check)
              value: "eu"
            - name: AI_MODEL               # D-187: gemini-3.5-flash, native endpoint eu, reasoning off, no tools
              value: "google/gemini-3.5-flash"
            - name: AI_PRICE_IN_EUR_PER_M  # D-187: € per million tokens (1 $ = 1 €), from the price lists; to be
              value: "1.50"             # confirmed on the official one (D-143)
            - name: AI_PRICE_OUT_EUR_PER_M # output, reasoning included (none with AI_THINKING_BUDGET 0)
              value: "9.00"
            - name: AI_PRICE_CACHED_EUR_PER_M
              value: "0.15"
            - name: AI_THINKING_BUDGET     # D-182/D-187: reasoning off on both models
              value: "0"
            - name: AI_TWIN_MODEL          # D-187: the twin on another model, failures independent
              value: "google/gemini-3.5-flash-lite"
            - name: AI_HEDGE_AFTER_S       # D-187: the twin after 3 s of silence (at once on a quick error)
              value: "3"
            - name: AI_TWIN_PRICE_IN_EUR_PER_M
              value: "0.30"
            - name: AI_TWIN_PRICE_OUT_EUR_PER_M
              value: "2.50"
            - name: AI_TWIN_PRICE_CACHED_EUR_PER_M
              value: "0.03"
            - name: AI_DEMOS               # P-60 step 9 (D-132): demonstration apartments with the real assistant;
              value: "true"             # needs roles/aiplatform.user on the BFF's account
            - name: GCP_PROJECT_ID
              value: your-gcp-project-id
            - name: GCP_REGION
              value: europe-west8
            - name: FIREBASE_PROJECT_ID
              value: your-gcp-project-id
            - name: CORS_ORIGINS
              value: https://your-staging-site.web.app,https://your-staging-site.firebaseapp.com
            - name: SECRET_MANAGER_PREFIX
              value: langbrain-api-key-
            - name: INSTANCE_TIMEOUT_S
              value: "10"
            - name: ITALIANWAY_SIGNATURE_HEADER
              value: X-Signature
            - name: ITALIANWAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: italianway-webhook-secret
                  key: latest
            - name: APP_PUBLIC_URL
              value: https://your-staging-site.web.app
            - name: SMTP_HOST
              value: smtp.gmail.com
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_USER
              value: your-smtp-user@example.com            # replaced by scripts/deploy.sh (SMTP_USER)
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-app-password
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
